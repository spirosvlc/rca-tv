<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RCA Setup</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div>
      <span class="eyebrow">RCA PROJECT</span>
      <h1>Broadcast control</h1>
    </div>
    <a class="button secondary" href="/">Open television</a>
  </header>

  <main class="admin-grid">
    <section class="panel">
      <h2>Add channel</h2>
      <form id="channelForm">
        <div class="row">
          <label>Channel number
            <input name="number" type="number" min="1" required>
          </label>
          <label>Name
            <input name="name" required placeholder="Cartoon Network">
          </label>
        </div>

        <label>Source type
          <select name="source_type">
            <option value="folder">Local folder</option>
            <option value="m3u">M3U URL</option>
            <option value="youtube">YouTube subscriptions</option>
          </select>
        </label>

        <label>Source
          <div class="source-input-row">
            <input
              id="channelSource"
              name="source"
              required
              placeholder="/media/rca/cartoons or https://..."
            >
            <button
              id="folderPickerButton"
              class="button compact secondary"
              type="button"
            >
              Choose folder
            </button>
          </div>
          <small class="field-help">
            For YouTube, connect your Google account below and select creators.
          </small>
        </label>

        <label>Logo URL
          <input name="logo_url" placeholder="Optional">
        </label>

        <button class="button" type="submit">Add and scan</button>
        <p id="channelStatus" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Channels</h2>
      <div id="channels" class="channel-list"></div>
    </section>

    <section class="panel">
      <h2>Test emergency broadcast</h2>
      <form id="alertForm">
        <label>Level
          <select name="level">
            <option value="medium">Medium — lower third</option>
            <option value="serious">Serious — modal</option>
            <option value="critical">Critical — full takeover + tone</option>
          </select>
        </label>

        <label>Message
          <textarea name="message" required></textarea>
        </label>

        <button class="button" type="submit">Broadcast</button>
      </form>
    </section>

    <section class="panel">
      <h2>Telegram and weather</h2>
      <form id="settingsForm">
        <label class="check">
          <input name="telegram_enabled" type="checkbox">
          Enable Telegram bot
        </label>

        <label>Telegram bot token
          <input name="telegram_token" type="password" autocomplete="off">
        </label>

        <label>Allowed Telegram chat ID
          <input name="telegram_chat_id">
        </label>

        <div class="divider"></div>

        <label>Weather provider
          <select name="weather_provider">
            <option value="open-meteo">Open-Meteo</option>
            <option value="emy">EMY adapter — future</option>
          </select>
        </label>

        <div class="row">
          <label>Latitude<input name="weather_latitude"></label>
          <label>Longitude<input name="weather_longitude"></label>
        </div>

        <label>Refresh every (minutes)
          <input name="weather_refresh_minutes" type="number" min="5" value="15">
        </label>

        <button class="button" type="submit">Save configuration</button>
        <p id="settingsStatus" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>News & weather ticker</h2>
      <form id="broadcastSettingsForm">
        <label class="check"><input name="news_enabled" type="checkbox"> Enable hourly Greek news ticker</label>
        <label>RSS URL<input name="news_rss_url" value="https://www.ertnews.gr/feed/"></label>
        <div class="row"><label>Show every (min)<input name="news_interval_minutes" type="number" value="60" min="15"></label><label>Headlines<input name="news_headlines" type="number" value="5" min="1" max="15"></label></div>
        <div class="divider"></div>
        <label class="check"><input name="emy_enabled" type="checkbox"> Enable EMY advisories</label>
        <label>EMY / MeteoAlarm feed<input name="emy_warnings_url" value="https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-greece"></label>
        <label>Warning area / region<input name="emy_region" value="Attica" placeholder="Attica"></label>
        <div class="row"><label>Check every (min)<input name="emy_interval_minutes" type="number" value="15" min="5"></label><label>Repeat warning (min)<input name="emy_repeat_minutes" type="number" value="60" min="15"></label></div>
        <button class="button" type="submit">Save broadcast feeds</button>
        <button id="testWeatherTicker" class="button secondary" type="button">Test weather ticker</button>
        <p id="broadcastStatus" class="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>YouTube account</h2>
      <form id="youtubeSettingsForm">
        <label>Google OAuth Client ID<input name="youtube_client_id"></label>
        <label>Google OAuth Client Secret<input name="youtube_client_secret" type="password"></label>
        <label>Redirect URI<input name="youtube_redirect_uri" value="http://127.0.0.1:8080/api/youtube/callback"></label>
        <label>Videos per creator<input name="youtube_videos_per_creator" type="number" value="3" min="1" max="10"></label>
        <button class="button" type="submit">Save YouTube settings</button>
        <button id="youtubeConnect" class="button secondary" type="button">Connect Google account</button>
        <button id="youtubeLoadSubs" class="button secondary" type="button">Load subscriptions</button>
        <div id="youtubeSubscriptions" class="subscription-list"></div>
        <p id="youtubeStatus" class="status"></p>
      </form>
    </section>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
